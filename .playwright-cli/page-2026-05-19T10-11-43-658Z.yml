              - text: "نريد تحويل كل صفحة من الكتاب الرّقمي إلى صفحة ناطقة، ذكية، قادرة على التفاعل مع التلميذ ودعم تعليمه وإرشاده وتصحيح أخطائه أو تشجيعه. في كل صفحة من الكتاب المدرسي تم وضع عناصر تفاعلية غلى كل كلمة او نص او صورة للوصول لهذا الهدف صممنا و أنجزنا أولا الكتاب المدرسي الرّقمي بطريقة تمكننا من ربطه ببرامج ملحقة تمكّن المتعلم من التفاعل مع كل صفحة من كتابه المدرسي.التطبيقات التفاعلية تدمج مع الكتاب الرّقمي عن طريق برامج ملحقة (Plugins Programs) تتخصص كل واحدة منها في تحقيق أهداف بيداغوجية مختلفة ومتعددة. سنفصّل في إثنين منها:ويمكن إستعمال هذه التطبيقات لأهداف بيداغوجية مختلفة:"
